name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_KLAVIYO_KEY: ${{ secrets.PUBLIC_KLAVIYO_KEY }}
          PUBLIC_KLAVIYO_LIST_ID: ${{ secrets.PUBLIC_KLAVIYO_LIST_ID }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_CREATE_AD_PAYMENT_URL: ${{ secrets.PUBLIC_CREATE_AD_PAYMENT_URL }}
          PUBLIC_REVIEW_AD_CAMPAIGN_URL: ${{ secrets.PUBLIC_REVIEW_AD_CAMPAIGN_URL }}
          PUBLIC_MODERATE_REPORT_URL: ${{ secrets.PUBLIC_MODERATE_REPORT_URL }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/

      # A partial FTP upload (Hostinger times out now and then) used to ship a
      # site whose pages referenced assets that were never uploaded, with no
      # signal that anything was wrong. Fetch the live pages and prove every
      # asset they reference actually resolves.
      - name: Verify the live site serves a complete build
        run: |
          set +e -uo pipefail   # GitHub runs `bash -e`; we do our own checks
          sleep 15
          fail=0
          for page in "https://joinnile.com/" "https://ads.joinnile.com/advertise/portal"; do
            origin=$(sed -E 's#(https?://[^/]+).*#\1#' <<<"$page")
            html=$(curl -fsSL --retry 4 --retry-delay 5 "$page") \
              || { echo "::error::$page did not load"; fail=1; continue; }

            # HTML must revalidate, or the next deploy strands this copy.
            cc=$(curl -fsSLI "$page" | tr -d '\r' | grep -i '^cache-control:' | tail -1 || true)
            echo "$page -> ${cc:-<no cache-control>}"
            grep -qi 'no-cache' <<<"$cc" \
              || { echo "::error::$page is cacheable (${cc:-none}) — .htaccess not applied"; fail=1; }

            assets=$(grep -oE '/_astro/[^"]+' <<<"$html" | sort -u || true)
            [ -n "$assets" ] \
              || { echo "::error::$page referenced no /_astro/ assets — not the expected build"; fail=1; }

            for asset in $assets; do
              read -r code type < <(curl -sSL -o /dev/null -w '%{http_code} %{content_type}\n' "$origin$asset")
              echo "  $asset -> $code $type"
              [ "$code" = 200 ] || { echo "::error::$origin$asset returned $code"; fail=1; }
              case "$asset:$type" in
                *.css:text/css*|*.js:text/javascript*|*.js:application/javascript*) ;;
                *.css:*|*.js:*) echo "::error::$origin$asset served as $type"; fail=1 ;;
              esac
            done
          done
          exit $fail
